{% extends 'inventory/base.html' %}

{% block content %}

    <h2>Type Inventory</h2>

    <table class="table">
        <thead>
            <tr>
                <th scope="col">Name</th>
                <th>Description</th>
                <th>Edit</th>
            </tr>
        </thead>
        <tbody>
            {% for type in types %}
            <tr>
                <td>
                    <a href="{% url 'inventory:typeitems' type.id %}">
                        {{ type.type_name }}
                    </a>
                </td>
                <td>{{ type.type_desc }}</td>
                <td>
                    <a href="{% url 'inventory:typedetail' type.id %}">
                        Edit
                    </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

{% endblock content %}
