{% extends 'inventory/base.html' %}

{% block content %}

    <h2>Type Inventory</h2>

    <table class="table">
        <thead>
            <tr>
                <th scope="col">Name</th>
                <th>Description</th>
                <th>Category</th>
                <th>Metal</th>
                <th>Purity</th>
                <th>Weight</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            {% for type in types %}
            <tr>
                <td>
                    <a href="{% url 'inventory:typeitems' type.id %}">
                        {{ type.type_name }}
                    </a>
                </td>
                <td>{{ type.type_desc }}</td>
                <td>{{ type.category }}</td>
                <td>{{ type.metal }}</td>
                <td>{{ type.purity }}</td>
                <td>{{ type.metal_weight }}</td>
                <td>
                    <a href="{% url 'inventory:typedetail' type.id %}">
                        <i class="bi bi-pencil-square"></i>
                    </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

{% endblock content %}
