{% extends 'inventory/base.html' %}

{% block content %}

    <h1>Inventory Page</h1>

    <table class="table">
        <thead>
            <tr>
                <th scope="col">Name</th>
                <th>Description</th>
                <th>Type</th>
                <th>Collection</th>
                <th>Edit</th>
            </tr>
        </thead>
        <tbody>
            {% for item in items %}
            <tr>
                <td>
                    <a href="{% url 'inventory:itemdetail' item.id %}">
                        {{ item.item_name }}
                    </a>
                </td>
                <td>{{ item.item_desc }}</td>
                <td>
                    <a href="{% url 'inventory:typeitems' item.type.id %}">
                        {{ item.type.type_name }}
                    </a>
                </td>
                <td>
                    <a href="{% url 'inventory:collitems' item.collection.id %}">
                        {{ item.collection.coll_name }}
                    </a>        
                </td>
                <td>
                    <a href="{% url 'inventory:itemdetail' item.id %}">
                        Edit
                    </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

{% endblock content %}
