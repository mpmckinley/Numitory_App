{% extends 'inventory/base.html' %}

{% block content %}

    <h2>Collection Inventory</h2>

    <table class="table">
        <thead>
            <tr>
                <th scope="col">Name</th>
                <th>Description</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            {% for collection in collections %}
            <tr>
                <td>
                    <a href="{% url 'inventory:collitems' collection.id %}">
                        {{ collection.coll_name }}
                    </a>
                </td>
                <td>{{ collection.coll_desc }}</td>
                <td>
                    <a href="{% url 'inventory:colldetail' collection.id %}">
                        <i class="bi bi-pencil-square"></i>
                    </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

{% endblock content %}
