     </ul>

                    <a class="nav-link dropdown-toggle nav_btn_pad" data-toggle="dropdown" href="#" role="button" aria-haspopup="true" aria-expanded="false">
                        <i class="bi bi-plus-circle bi_nav"></i>
                    </a>
                    <div class="dropdown-menu">
                        <a class="dropdown-item" href="{% url 'inventory:itemcreate' %}">Item</a>
                        <a class="dropdown-item" href="{% url 'inventory:typecreate' %}">Type</a>
                        <a class="dropdown-item" href="{% url 'inventory:collcreate' %}">Collection</a>
                    </div>
                </li>
                <li class="nav-item my-2">
                    <a href="{% url 'edituser' user.id %}">
                        <button type="submit" class="btn btn-outline-secondary btn-sm btn-margin-left">{{ user }}</button>
                    </a>
                </li>
                <li class="nav-item my-2">
                    <form action="{% url 'logoutuser' %}" method="POST">
                    {% csrf_token %}
                        <button type="submit" class="btn btn-outline-danger btn-sm btn-margin-left">Logout</button>
                    </form>
                </li>
            {% else %}
                <li class="nav-item my-2">
                    <a href="{% url 'signupuser' %}">
                        <button class="btn btn-success btn-sm">Sign Up</button>
                    </a>
                </li>
                <li class="nav-item my-2">
                    <a href="{% url 'loginuser' %}">
                        <button class="btn btn-primary btn-margin-left btn-sm">Login</button>
                    </a>
                </li>
            {% endif %}
        </ul>
  </div>
</nav>
